[package]
name = "ide-plugin-host"
version = "0.1.0"
edition = "2021"
description = "WASM extension runtime: Wasmtime engine, manifest parsing, host API"

[dependencies]
wasmtime = "48"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
