[package]
name = "ide-plugin-host"
version = "0.1.0"
edition = "2021"
description = "Yavin's extension host (IDE-08): extension JavaScript in QuickJS, one runtime per extension, in its own process, reachable only through the extension protocol"

[lib]
name = "ide_plugin_host"
path = "src/lib.rs"

[[bin]]
name = "yavin-extension-host"
path = "src/main.rs"

[dependencies]
# QuickJS without its std/os modules: no filesystem, network or process access exists to grant.
rquickjs = { version = "0.14", default-features = false }
serde_json = { workspace = true }
# The Content-Length framing shared with the language servers and debug adapters.
ide-workspace = { path = "../ide-workspace" }
