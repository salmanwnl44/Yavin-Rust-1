[package]
name = "ide-workspace"
version = "0.1.0"
edition = "2021"
description = "Project management: file tree, search, git integration, and FS operations"

[features]
# EXT-33 E5 (test-only): enables `c2::C2Authority::with_profiles`, the only way to register a C2
# server profile. Off by default, so a packaged production build cannot construct one -- a test
# profile cannot ship. Enabled only for tests (`--features c2-test-profiles`).
c2-test-profiles = []

[dependencies]
notify = "=9.0.0-rc.5"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# EXT-33 E1: verifying a brokered C1 program's identity (SHA-256) at every launch.
sha2 = "0.10"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[target.'cfg(windows)'.dependencies]
# A Job Object: language servers (and whatever they start) end with Yavin, however it ends.
# The extension host sandbox (EXT-10): AppContainer, file ACLs, pipes, process attributes.
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Isolation", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_System_WindowsProgramming"] }
