[package]
name = "ide-workspace"
version = "0.1.0"
edition = "2021"
description = "Project management: file tree, search, git integration, and FS operations"

[dependencies]
notify = "=9.0.0-rc.5"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[target.'cfg(windows)'.dependencies]
# A Job Object: language servers (and whatever they start) end with Yavin, however it ends.
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
