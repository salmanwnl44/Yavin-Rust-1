[workspace]
members = ["crates/ide-workspace"]
exclude = ["crates/ide-core", "crates/ide-config", "crates/ide-syntax", "crates/ide-lsp", "crates/ide-dap", "crates/ide-terminal", "crates/ide-plugin-host"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[package]
name = "yavin-ide"
version = "0.1.0"
description = "Yavin IDE — a cross-platform code editor"
authors = ["you"]
edition = "2021"

[lib]
name = "yavin_ide_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { workspace = true }
serde_json = { workspace = true }
ide-workspace = { path = "crates/ide-workspace" }
portable-pty = "0.9.0"
