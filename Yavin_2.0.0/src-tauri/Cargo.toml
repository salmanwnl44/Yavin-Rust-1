[workspace]
members = ["crates/ide-workspace", "crates/ide-localgit", "crates/ide-terminal-protocol", "crates/ide-plugin-host"]
exclude = ["crates/ide-core", "crates/ide-config", "crates/ide-syntax", "crates/ide-lsp", "crates/ide-dap"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[package]
name = "yavin-ide"
version = "0.1.0"
description = "Yavin IDE — a cross-platform code editor"
authors = ["you"]
edition = "2021"

[lib]
name = "yavin_ide_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Accepts plain-HTTP extension registries on the loopback interface: the end-to-end test's local
# registry (IDE-09). Never enabled in a normal build.
test-registry = []

[dependencies]
tauri = { version = "2", features = [] }
serde = { workspace = true }
serde_json = { workspace = true }
ide-workspace = { path = "crates/ide-workspace" }
ide-localgit = { path = "crates/ide-localgit" }
portable-pty = "0.9.0"
# portable-pty's own error type, read to tell an OS failure's kind from anything else.
anyhow = "1"
# The terminal contract (TERMINAL-00): identities, states, errors and the output protocol.
ide-terminal-protocol = { path = "crates/ide-terminal-protocol" }
ureq = { version = "3", default-features = false, features = ["native-tls"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
# A terminal's shell and everything it starts are ended as one process group (`killpg`).
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# A Local Git restore recreates Windows junctions (FSCTL_SET_REPARSE_POINT), never by a process.
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl"] }
